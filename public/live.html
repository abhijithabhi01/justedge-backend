<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Just Edge — Live Sensor</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Segoe UI', system-ui, sans-serif;
      background: #0f1117;
      color: #e2e8f0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 40px 20px;
    }

    header {
      width: 100%;
      max-width: 1100px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 28px;
    }

    header h1 { font-size: 1.3rem; font-weight: 600; color: #f1f5f9; }
    header h1 span { color: #f97316; }

    .pill {
      font-size: 0.72rem;
      padding: 4px 10px;
      border-radius: 99px;
      background: #1e2330;
      color: #94a3b8;
    }
    .pill.live { background: #052e16; color: #4ade80; }

    .meta-row {
      width: 100%;
      max-width: 1100px;
      display: flex;
      gap: 20px;
      margin-bottom: 24px;
      font-size: 0.8rem;
      color: #64748b;
    }
    .meta-row b { color: #94a3b8; }

    /* ── Grid of sensor cards ── */
    .grid {
      width: 100%;
      max-width: 1100px;
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
      gap: 18px;
      margin-bottom: 32px;
    }

    .card {
      background: #1a1f2e;
      border: 1px solid #2d3748;
      border-radius: 16px;
      padding: 28px 22px;
      text-align: center;
      transition: border-color 0.2s;
    }
    .card.has-data { border-color: #334155; }
    .card.no-data  { opacity: 0.55; }

    .device-label {
      font-size: 0.78rem;
      color: #64748b;
      margin-bottom: 6px;
      letter-spacing: 0.05em;
      text-transform: uppercase;
    }

    .temp-big {
      font-size: 3.2rem;
      font-weight: 700;
      line-height: 1;
      color: #38bdf8;
      margin: 10px 0 4px;
      transition: color 0.3s;
    }
    .temp-big.hot  { color: #ef4444; }
    .temp-big.warm { color: #f97316; }
    .temp-big.cool { color: #38bdf8; }
    .temp-big.empty { color: #475569; font-size: 2rem; }

    .unit { color: #64748b; font-size: 0.85rem; margin-bottom: 10px; }

    .recorded-at {
      font-size: 0.72rem;
      color: #475569;
      min-height: 1.2em;
    }

    .card-status {
      margin-top: 12px;
      font-size: 0.7rem;
      color: #64748b;
    }
    .card-status .ok { color: #4ade80; }
    .card-status .err { color: #f87171; }

    /* ── Combined recent log ── */
    .log-header {
      width: 100%;
      max-width: 1100px;
      font-size: 0.8rem;
      color: #64748b;
      margin-bottom: 8px;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    .log {
      width: 100%;
      max-width: 1100px;
      background: #1a1f2e;
      border: 1px solid #2d3748;
      border-radius: 12px;
      overflow: hidden;
      max-height: 360px;
      overflow-y: auto;
    }

    .log-row {
      display: grid;
      grid-template-columns: 140px 1fr 100px 160px;
      padding: 10px 18px;
      border-bottom: 1px solid #1e2330;
      font-size: 0.82rem;
      align-items: center;
      animation: fadeIn 0.3s ease;
    }
    .log-row:last-child { border-bottom: none; }
    .log-row:first-child { background: #1e2a1e; }

    .log-row .dev { color: #94a3b8; font-size: 0.75rem; }
    .log-row .t   { color: #4ade80; font-weight: 600; }
    .log-row .ts  { color: #64748b; font-size: 0.75rem; text-align: right; }
    .log-row .idx { color: #334155; }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(-4px); }
      to   { opacity: 1; }
    }

    .error-box {
      width: 100%;
      max-width: 1100px;
      background: #1a0a0a;
      border: 1px solid #7f1d1d;
      border-radius: 10px;
      padding: 14px 18px;
      color: #fca5a5;
      font-size: 0.85rem;
      display: none;
      margin-bottom: 16px;
    }

    @media (max-width: 600px) {
      .log-row { grid-template-columns: 100px 1fr 80px; }
      .log-row .ts { display: none; }
      .temp-big { font-size: 2.6rem; }
    }
  </style>
</head>
<body>

<header>
  <h1>Just Edge <span>IoT</span> Monitor</h1>
  <span class="pill live" id="status-pill">● CONNECTING</span>
</header>

<div class="meta-row">
  <span>Polls <b>every 5s</b></span>
  <span>Last fetch: <b id="last-fetch">—</b></span>
  <span>Updates: <b id="update-count">0</b></span>
</div>

<div class="error-box" id="error-box"></div>

<div class="grid" id="grid">
  <!-- cards injected by JS -->
</div>

<div class="log-header">Recent readings (all boards)</div>
<div class="log" id="log"></div>

<script>
  // Known boards (fallback if /ui/boards is unreachable)
  const DEFAULT_BOARDS = [
    { deviceId: 'Susima_IoT1', label: 'Susima IoT 1' },
    { deviceId: 'DynamoDB_2',  label: 'DynamoDB 2' },
    { deviceId: 'DynamoDB_3',  label: 'DynamoDB 3' },
    { deviceId: 'DynamoDB_4',  label: 'DynamoDB 4' },
  ];

  let boards      = DEFAULT_BOARDS;
  let interval    = null;
  let updateCount = 0;
  let lastTsMap   = {};   // deviceId → last timestamp seen
  const MAX_LOG   = 30;

  // ── Build empty cards ────────────────────────────────────────────────────
  function renderCards() {
    const grid = document.getElementById('grid');
    grid.innerHTML = '';
    boards.forEach(b => {
      const card = document.createElement('div');
      card.className = 'card no-data';
      card.id = 'card-' + b.deviceId;
      card.innerHTML = `
        <div class="device-label">${b.label || b.deviceId}</div>
        <div class="temp-big empty" id="temp-${b.deviceId}">—</div>
        <div class="unit">°C</div>
        <div class="recorded-at" id="rec-${b.deviceId}">Waiting…</div>
        <div class="card-status" id="st-${b.deviceId}"></div>
      `;
      grid.appendChild(card);
    });
  }

  // ── Poll ─────────────────────────────────────────────────────────────────
  async function fetchAll() {
    try {
      const res  = await fetch('/api/iot/ui/live-all');
      const data = await res.json();

      if (!res.ok) { showError(data.error || 'Fetch failed'); return; }
      hideError();

      document.getElementById('last-fetch').textContent =
        new Date().toLocaleTimeString('en-IN');
      document.getElementById('status-pill').textContent = '● LIVE';
      document.getElementById('status-pill').className = 'pill live';

      // If server returns a different board list, adopt it
      if (Array.isArray(data.boards) && data.boards.length) {
        const ids = data.boards.map(b => b.deviceId).join(',');
        const cur = boards.map(b => b.deviceId).join(',');
        if (ids !== cur) {
          boards = data.boards.map(b => ({
            deviceId: b.deviceId,
            label:    b.label || b.deviceId,
          }));
          renderCards();
        }
      }

      let anyNew = false;
      for (const entry of (data.boards || [])) {
        const id      = entry.deviceId;
        const reading = entry.reading;
        const card    = document.getElementById('card-' + id);
        const tempEl  = document.getElementById('temp-' + id);
        const recEl   = document.getElementById('rec-' + id);
        const stEl    = document.getElementById('st-' + id);
        if (!card || !tempEl) continue;

        if (reading && reading.temperature != null) {
          card.className = 'card has-data';
          const t = reading.temperature;
          tempEl.textContent = t;
          tempEl.className   = 'temp-big ' + tempClass(t);

          const ts = reading.recordedAt
            ? new Date(reading.recordedAt).toLocaleString('en-IN')
            : '—';
          recEl.textContent = 'Recorded: ' + ts;
          stEl.innerHTML = '<span class="ok">● data</span>';

          // log only when this board produces a new timestamp
          if (reading.timestamp !== lastTsMap[id]) {
            lastTsMap[id] = reading.timestamp;
            anyNew = true;
            addLogRow(entry.label || id, t, ts);
          }
        } else {
          card.className = 'card no-data';
          tempEl.textContent = '—';
          tempEl.className   = 'temp-big empty';
          recEl.textContent  = 'No data';
          stEl.innerHTML     = '<span class="err">● offline / empty</span>';
        }
      }

      if (anyNew) {
        updateCount++;
        document.getElementById('update-count').textContent = updateCount;
      }

    } catch (err) {
      showError('Fetch failed: ' + err.message);
    }
  }

  function addLogRow(deviceLabel, temp, ts) {
    const log = document.getElementById('log');
    const row = document.createElement('div');
    row.className = 'log-row';
    row.innerHTML = `
      <span class="dev">${deviceLabel}</span>
      <span class="idx">#${updateCount + 1}</span>
      <span class="t">${temp}°C</span>
      <span class="ts">${ts}</span>
    `;
    log.insertBefore(row, log.firstChild);
    while (log.children.length > MAX_LOG) log.removeChild(log.lastChild);
  }

  function tempClass(t) {
    if (t === '—' || t == null) return 'empty';
    return t >= 35 ? 'hot' : t >= 28 ? 'warm' : 'cool';
  }

  function showError(msg) {
    const b = document.getElementById('error-box');
    b.textContent = '⚠ ' + msg;
    b.style.display = 'block';
    document.getElementById('status-pill').textContent = '● ERROR';
    document.getElementById('status-pill').className = 'pill';
  }

  function hideError() {
    document.getElementById('error-box').style.display = 'none';
  }

  // ── Boot ─────────────────────────────────────────────────────────────────
  renderCards();
  fetchAll();
  interval = setInterval(fetchAll, 5000);
</script>
</body>
</html>
